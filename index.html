<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Profile Factory</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #e8ecef; }
        .wa-dark { background-color: #075e54; }
        .wa-green { background-color: #25d366; }
        .wa-blue { background-color: #0077b5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .blur-digits { filter: blur(5px); user-select: none; display: inline-block; letter-spacing: 2px; }

        /* 3D Claymorphism Card Styles based on image */
        .clay-card {
            background: #ffffff;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08), 
                        0 10px 15px -5px rgba(0, 0, 0, 0.03),
                        inset 0 2px 4px rgba(255, 255, 255, 1),
                        inset 0 -5px 8px rgba(0, 0, 0, 0.05);
            border: 4px solid #e1e6eb;
            border-radius: 2.2rem;
        }
        .clay-circle-img {
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.2), 
                        inset 0 -4px 6px rgba(255, 255, 255, 0.9),
                        0 6px 12px rgba(0, 0, 0, 0.08);
            border: 3.5px solid #d0d7de;
        }
        .clay-whatsapp-btn {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.4), 
                        inset 0 -3px 5px rgba(0, 0, 0, 0.2),
                        0 8px 16px rgba(37, 211, 102, 0.3);
            border: 3px solid #e1e6eb;
        }
        .clay-badge {
            background: linear-gradient(135deg, #f0f9f4 0%, #dcfce7 100%);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 
                        0 3px 6px rgba(0, 0, 0, 0.04);
            border: 1.5px solid #a7f3d0;
        }
/* Profile Image Perfect Framing for Face Focus */
.clay-circle-img {
    object-fit: cover;
    object-position: center top; /* Yeh chehre (face) ko upar ki taraf se frame mein focus karega */
}
    </style>
</head>
<body class="font-sans pb-16 text-gray-800">

    <!-- Minimal Header -->
    <header class="wa-dark text-white sticky top-0 z-50 shadow-sm">
        <div class="px-4 py-3 flex justify-between items-center">
            <h1 id="appTitle" class="text-sm font-bold tracking-wide">WhatsApp Profile Factory</h1>
            <div class="flex items-center gap-2">
                <!-- Language Toggle Button -->
                <button onclick="toggleLanguage()" id="langBtn" class="bg-white/10 hover:bg-white/20 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold transition">
                    English
                </button>
                <!-- Add / My Profile Button -->
                <button onclick="openModal()" id="profileBtn" class="text-white px-3 py-1 rounded-lg text-[11px] font-bold shadow-sm transition">
                    Add Profile
                </button>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="px-4 pb-2.5">
            <div id="categoryContainer" class="flex gap-1.5 overflow-x-auto no-scrollbar">
                <!-- Categories rendered dynamically -->
            </div>
        </div>
    </header>

    <!-- User List Container -->
    <main class="max-w-md mx-auto p-3.5 space-y-4">
        <div id="userList" class="space-y-4">
            <!-- Cards will load here -->
        </div>
    </main>

    <!-- Add/Edit Profile Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl relative">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-sm">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 id="modalTitle" class="text-xs font-bold text-gray-900 mb-3 uppercase tracking-wider">Nayi Profile Banayein</h2>
            
            <form id="profileForm" onsubmit="saveProfile(event)" class="space-y-2.5">
                <div>
                    <label id="lblNaam" class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Poora Naam</label>
                    <input type="text" id="pName" required placeholder="Aman Kumar" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label id="lblNumber" class="block text-[10px] font-bold text-gray-400 uppercase mb-1">WhatsApp Number</label>
                    <div class="flex gap-2">
                        <input type="text" id="pCountry" value="+91" maxlength="5" class="w-20 p-2.5 bg-gray-100 border border-gray-200 rounded-xl text-xs font-bold text-center focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        <input type="tel" id="pPhone" required maxlength="10" placeholder="Mobile number" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>
                <div>
                    <label id="lblCat" class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Category</label>
                    <select id="pCategory" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold">
                        <option value="Chat Boy">Chat Boy</option>
                        <option value="Chat Girl">Chat Girl</option>
                        <option value="Business Boy">Business Boy</option>
                        <option value="Business Girl">Business Girl</option>
                    </select>
                </div>
                <div>
                    <label id="lblPhoto" class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Profile Photo</label>
                    <input type="file" id="pImage" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" id="saveBtn" class="w-full wa-green text-white py-2.5 rounded-xl text-xs font-bold shadow-md">Publish</button>
                    <button type="button" id="deleteBtn" onclick="deleteProfile()" class="hidden w-1/3 bg-red-50 text-red-600 border border-red-200 py-2.5 rounded-xl text-xs font-bold">Delete</button>
                </div>
            </form>
        </div>
    </div>

<<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc, query, orderBy, limit, startAfter } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrJILcCZeSnDDu9...",
            authDomain: "whatschat-6a5d2.firebaseapp.com",
            projectId: "whatschat-6a5d2",
            storageBucket: "whatschat-6a5d2.appspot.com",

            appId: "1:339092565956:web:3714..."
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const CLOUD_NAME = "c4pulmrv";
        const PRESET = "ml_default";

        let users = [];
        let currentCat = "All";
        let lang = localStorage.getItem("app_lang") || "hi";
        let lastVisible = null; 
        let hasMore = true;     

        const translations = {
            hi: {
                addProf: "प्रोफाइल जोड़े",
                myProf: "माय प्रोफाइल",
                title: "WhatsApp Profile Factory",
                naam: "पूरा नाम",

                cat: "कैटेगरी",

                pub: "पब्लिश करें",
                del: "हटाएं",
                modalNew: "नयी प्रोफाइल बनायेइन",
                modalEdit: "अपनी प्रोफाइल एडिट करें",
                noData: "कोई प्रोफाइल नहीं मिली!",
                alertPhoto: "फोटो जरूरी है!",
                alertDelete: "क्या आप प्रोफाइल डिलीट करना चाहते हैं?",
                alertError: "सेव करने में एरर आया",
                uploading: "अपलोड हो रहा है...",
                offlineAlert: "कृपया अपना इंटरनेट कनेक्शन जांचें (Check your internet connection)",
                loadingText: "डेटा लोड हो रहा है...",
                loadMore: "और लोड करें (Load More)",
                categories: {
                    "All": "सभी (All)",
                    "Chat Boy": "चैट बॉय",
                    "Chat Girl": "चैट गर्ल",
                    "Business Boy": "बिजनेस बॉय",
                    "Business Girl": "बिजनेस गर्ल"
                }
            },
            en: {
                addProf: "Add Profile",
                myProf: "My Profile",
                title: "WhatsApp Profile Factory",
                naam: "Full Name",
                num: "WhatsApp Number",
                cat: "Category",
                photo: "Choose Profile",
                pub: "Publish",
                del: "Delete",
                modalNew: "Create New Profile",
                modalEdit: "Edit Your Profile",
                noData: "No profiles found!",
                alertPhoto: "Photo is required!",
                alertDelete: "Do you want to delete profile?",
                alertError: "Error saving profile",
                uploading: "Uploading...",
                offlineAlert: "Please check your internet connection",
                loadingText: "Loading data...",
                loadMore: "Load More",
                categories: {
                    "All": "All",
                    "Chat Boy": "Chat Boy",
                    "Chat Girl": "Chat Girl",
                    "Business Boy": "Business Boy",
                    "Business Girl": "Business Girl"
                }
            }
        };

        window.onload = () => {
            applyLanguage();
            fetchProfiles();
        };

        function showLoader(show, text = "") {
            let loader = document.getElementById("androidLoader");
            if (!loader) {
                loader = document.createElement("div");
                loader.id = "androidLoader";
                loader.className = "fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50 transition-opacity";
                loader.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-3 text-center max-w-[280px]">
                        <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                        <span id="loaderText" class="text-xs font-bold text-gray-700 leading-relaxed"></span>
                    </div>
                `;
                document.body.appendChild(loader);
            }

            if (show) {
                const textEl = document.getElementById("loaderText");
                if (textEl) textEl.innerText = text;
                loader.style.display = "flex";
            } else {
                loader.style.display = "none";
            }
        }

        async function fetchProfiles() {
            const t = translations[lang];

            if (!navigator.onLine) {
                showLoader(true, t.offlineAlert);
                const myProfileData = localStorage.getItem("my_profile");
                users = myProfileData ? [JSON.parse(myProfileData)] : [];
                hasMore = false; 
                render();
                updateProfileButtonState();
                return; 
            }

            showLoader(true, t.loadingText);

            try {
                const q = query(collection(db, "profiles"), orderBy("timestamp", "desc"), limit(20));
                const snap = await getDocs(q);
                
                let freshUsers = [];
                snap.forEach(d => freshUsers.push({ id: d.id, ...d.data() }));
                
                hasMore = true; 
                
                if (snap.docs.length > 0) {
                    lastVisible = snap.docs[snap.docs.length - 1];
                }
                
                const myProfileData = localStorage.getItem("my_profile");
                if (myProfileData) {
                    const myProfObj = JSON.parse(myProfileData);
                    freshUsers = freshUsers.filter(u => u.profileId !== myProfObj.profileId);
                    freshUsers.unshift(myProfObj);
                }

                users = freshUsers;
                render();
            } catch (e) {
                console.log("Firebase fetch error:", e);
                const myProfileData = localStorage.getItem("my_profile");
                if (myProfileData) {
                    users = [JSON.parse(myProfileData)];
                    render();
                }
            } finally {
                showLoader(false);
            }
            updateProfileButtonState();
        }

        window.loadMoreProfiles = async function() {
    if (!navigator.onLine || !lastVisible) return;
    const t = translations[lang];
    
    showLoader(true, t.loadingText);

    setTimeout(async () => {
        try {
            const q = query(
                collection(db, "profiles"), 
                orderBy("timestamp", "desc"), 
                startAfter(lastVisible), 
                limit(20)
            );
            const snap = await getDocs(q);
            
            if (snap.docs.length > 0) {
                lastVisible = snap.docs[snap.docs.length - 1];
                let moreUsers = [];
                snap.forEach(d => moreUsers.push({ id: d.id, ...d.data() }));
                
                hasMore = true;
                users = [...users, ...moreUsers];
                render();
                showLoader(false);
            } else {
                showLoader(false);
                showToast(t.noData);
            }
        } catch (e) {
            console.log("Load more error:", e);
            showLoader(false);
        }
    }, 2000);
};

window.render = function() {
    const list = document.getElementById("userList");
    if (!list) return;
    list.innerHTML = "";
    let filtered = currentCat === "All" ? users : users.filter(u => u.category === currentCat);
    const t = translations[lang];

    if (filtered.length === 0) {
        list.innerHTML = `<div class="bg-white p-8 rounded-3xl text-center text-gray-400 text-xs shadow-sm">${t.noData}</div>`;
    } else {
        filtered.forEach(u => {
            const maskedDisplay = maskNumber(u.phone);
            const rawCleanNum = u.phone ? u.phone.replace(/[^0-9]/g, '') : '';
            const catLabel = t.categories[u.category] || u.category;
            
            list.innerHTML += `
                <div class="clay-card p-4.5 flex items-center justify-between transition hover:scale-[1.01] gap-3 mb-4">
                    <div class="flex items-center gap-4 min-w-0 flex-1">
                        <div class="w-20 h-20 rounded-full overflow-hidden flex-shrink-0 shadow-md clay-circle-img flex items-center justify-center bg-gray-100 border-2 border-white">
                            <img src="${u.imageUrl}" 
                                 class="w-full h-full object-cover scale-110" 
                                 style="object-position: center 20%;"
                                 alt="${u.name}">
                        </div>
                        <div class="flex flex-col min-w-0">
                            <h4 class="font-bold text-base text-gray-900 tracking-tight truncate">${u.name}</h4>
                            <p class="text-xs text-gray-500 font-semibold tracking-wider mt-1">${maskedDisplay}</p>
                            <div class="mt-2">
                                <span class="inline-block clay-badge text-emerald-800 text-[11px] px-3 py-0.5 rounded-full font-bold shadow-sm">${catLabel}</span>
                            </div>
                        </div>
                    </div>
                    <a href="https://wa.me/${rawCleanNum}" target="_blank" class="clay-whatsapp-btn text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl transition active:scale-90 flex-shrink-0 my-auto shadow-md">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            `;
        });
    }

    // Load More button sirf tabhi dikhega jab hasMore true ho aur current category "All" ho
    if (hasMore && currentCat === "All") {
        list.innerHTML += `
            <div class="flex justify-center mt-4 mb-2">
                <button onclick="loadMoreProfiles()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> ${t.loadMore}
                </button>
            </div>
        `;
    }
};

        function showToast(message) {
            let toast = document.getElementById("customToast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "customToast";
                toast.className = "fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg z-50 transition-opacity duration-300";
                document.body.appendChild(toast);
            }
            toast.innerText = message;
            toast.style.opacity = "1";
            toast.style.display = "block";

            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => { toast.style.display = "none"; }, 300);
            }, 2000);
        }

        function maskNumber(fullNum) {
            if (!fullNum) return "";
            const clean = fullNum.trim();
            const match = clean.match(/^(\+\d+)(\d{2})(\d{8})$/) || clean.match(/^(\+\d+)(\d{2})(\d+)$/);
            if (!match) return clean;
            const [, code, firstTwo, rest] = match;
            return `${code} ${firstTwo}<span class="blur-digits">${rest}</span>`;
        }

        window.filterCategory = (cat) => {
            currentCat = cat;
            applyLanguage();
            render();
        }

        window.openModal = () => {
            document.getElementById("profileModal").classList.remove("hidden");
            const my = localStorage.getItem("my_profile");
            const t = translations[lang];
            
            if (my) {
                const data = JSON.parse(my);
                document.getElementById("modalTitle").innerText = t.modalEdit;
                document.getElementById("pName").value = data.name || "";
                
                const fullPhone = data.phone || "+91";
                const phonePart = fullPhone.slice(-10);
                const countryPart = fullPhone.slice(0, -10);
                
                document.getElementById("pCountry").value = countryPart || "+91";
                document.getElementById("pPhone").value = phonePart;

                document.getElementById("pCategory").value = data.category || "Chat Boy";
                document.getElementById("deleteBtn").classList.remove("hidden");
            } else {
                document.getElementById("modalTitle").innerText = t.modalNew;
                document.getElementById("pName").value = "";
                document.getElementById("pCountry").value = "+91";
                document.getElementById("pPhone").value = "";
                document.getElementById("pCategory").value = "Chat Boy";
                document.getElementById("deleteBtn").classList.add("hidden");
            }
        }

        window.closeModal = () => document.getElementById("profileModal").classList.add("hidden");

        window.saveProfile = async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById("pImage");
    const file = fileInput.files[0];
    const t = translations[lang];
    const oldMyProf = JSON.parse(localStorage.getItem("my_profile"));

    if (!file && !oldMyProf) {
        alert(t.alertPhoto);
        return;
    }

    const btn = document.getElementById("saveBtn");
    btn.innerText = t.uploading;
    btn.disabled = true;

    try {
        let imageUrl = oldMyProf ? oldMyProf.imageUrl : "";

        if (file && navigator.onLine) {
            // 1. लाखों इमेजेस फिट करने के लिए इमेज को ज्यादा कंप्रेस (छोटा) किया गया है (Size: ~5-10 KB)
            const compressedFile = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 150;  // पिक्सेल साइज़ घटाकर छोटा किया गया
                        const maxHeight = 150;

                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            }));
                        }, 'image/jpeg', 0.3); // 0.3 क्वालिटी से साइज़ बहुत ज्यादा कम हो जाएगा
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });

            // 2. कंप्रेस की हुई फाइल को क्लाउडिनरी पर अपलोड किया जा रहा है
            const fd = new FormData();
            fd.append("file", compressedFile);
            fd.append("upload_preset", PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
            const uploadData = await res.json();
            imageUrl = uploadData.secure_url;
        } else if (file && !navigator.onLine) {
            alert("Internet is required to update photo!");
            btn.innerText = t.pub;
            btn.disabled = false;
            return;
        }

        const name = document.getElementById("pName").value;
        const country = document.getElementById("pCountry").value.trim();
        const rawPhone = document.getElementById("pPhone").value.trim().slice(-10); 
        const fullPhone = country + rawPhone;
        const category = document.getElementById("pCategory").value;
        
        const profileId = oldMyProf ? oldMyProf.profileId : "user_" + Date.now();
        const profileData = { profileId, name, phone: fullPhone, category, imageUrl, timestamp: Date.now() };
        
        localStorage.setItem("my_profile", JSON.stringify(profileData));

        if (navigator.onLine) {
            try {
                await setDoc(doc(db, "profiles", profileId), profileData);
            } catch (fbErr) {
                console.log("Firebase sync failed, but local data is saved.");
            }
        }

        closeModal();
        fetchProfiles();
    } catch (err) {
        alert(t.alertError);
    } finally {
        btn.innerText = t.pub;
        btn.disabled = false;
    }
}

        window.deleteProfile = async () => {
            const t = translations[lang];
            if (confirm(t.alertDelete)) {
                const my = JSON.parse(localStorage.getItem("my_profile"));
                if (my && navigator.onLine) {
                    try {
                        await deleteDoc(doc(db, "profiles", my.profileId));
                    } catch (fbErr) {
                        console.log("Firebase delete error:", fbErr);
                    }
                }
                
                localStorage.removeItem("my_profile");
                closeModal();
                fetchProfiles();
            }
        }

        function updateProfileButtonState() {
            const my = localStorage.getItem("my_profile");
            const btn = document.getElementById("profileBtn");
            if (!btn) return;
            const t = translations[lang];
            
            if (my) {
                btn.innerText = t.myProf; 
                btn.className = "wa-blue text-white px-3 py-1 rounded-lg text-[11px] font-bold shadow-sm transition"; 
            } else {
                btn.innerText = t.addProf; 
                btn.className = "wa-green text-white px-3 py-1 rounded-lg text-[11px] font-bold shadow-sm transition"; 
            }
        }

        window.toggleLanguage = () => {
            lang = lang === "hi" ? "en" : "hi";
            localStorage.setItem("app_lang", lang);
            applyLanguage();
            updateProfileButtonState();
            render();
        }
function applyLanguage() {
            const t = translations[lang];
            const langBtn = document.getElementById("langBtn");
            if (langBtn) langBtn.innerText = lang === "hi" ? "English" : "हिंदी";
            
            const elNaam = document.getElementById("lblNaam");
            if (elNaam) elNaam.innerText = t.naam;
            
            const elNum = document.getElementById("lblNumber");
            if (elNum) elNum.innerText = t.num;
            
            const elCat = document.getElementById("lblCat");
            if (elCat) elCat.innerText = t.cat;
            
            const elPhoto = document.getElementById("lblPhoto");
            if (elPhoto) elPhoto.innerText = t.photo;
            
            const saveBtn = document.getElementById("saveBtn");
            if (saveBtn) saveBtn.innerText = t.pub;
            
            const deleteBtn = document.getElementById("deleteBtn");
            if (deleteBtn) deleteBtn.innerText = t.del;

            const catContainer = document.getElementById("categoryContainer");
            if (catContainer) {
                const cats = ["All", "Chat Boy", "Chat Girl", "Business Boy", "Business Girl"];
                catContainer.innerHTML = "";
                cats.forEach(c => {
                    const isActive = currentCat === c;
                    const cls = isActive 
                        ? "cat-btn bg-white text-emerald-950 px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-sm"
                        : "cat-btn bg-emerald-900/40 text-white px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap";
                    catContainer.innerHTML += `<button onclick="filterCategory('${c}')" class="${cls}" data-cat="${c}">${t.categories[c]}</button>`;
                });
            }
        }
    </script>
</body>
</html>
