function showLoader(show, text = "") {
            let loader = document.getElementById("androidLoader");
            if (!loader) {
                loader = document.createElement("div");
                loader.id = "androidLoader";
                loader.className = "fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-50 transition-opacity";
                loader.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-3 text-center max-w-[280px]">
                        <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                        <span id="loaderText" class="text-xs font-bold text-gray-700 leading-relaxed"></span>
                    </div>
                `;
                document.body.appendChild(loader);
            }
            if (show) {
                const textEl = document.getElementById("loaderText");
                if (textEl) textEl.innerText = text;
                loader.style.display = "flex";
            } else {
                loader.style.display = "none";
            }
        }

                async function fetchProfiles() {
            const t = translations[lang];
            if (!navigator.onLine) {
                showLoader(true, t.offlineAlert);
                const myProfileData = localStorage.getItem("my_profile");
                users = myProfileData ? [JSON.parse(myProfileData)] : [];
                hasMore = false; 
                render();
                updateProfileButtonState();
                return; 
            }

            showLoader(true, t.loadingText);
            try {
                const q = query(collection(db, "profiles"), orderBy("timestamp", "desc"), limit(20));
                const snap = await getDocs(q);
                let freshUsers = [];
                snap.forEach(d => freshUsers.push({ id: d.id, ...d.data() }));
                
                hasMore = true; 
                if (snap.docs.length > 0) {
                    lastVisible = snap.docs[snap.docs.length - 1];
                }

                users = freshUsers;
                render();
            } catch (e) {
                const myProfileData = localStorage.getItem("my_profile");
                if (myProfileData) {
                    users = [JSON.parse(myProfileData)];
                    render();
                }
            } finally {
                showLoader(false);
            }
            updateProfileButtonState();
        }

            // यदि हमारे पास आखिरी पॉइंटर है, तो उसके आगे का डेटा लाएं
            if (lastVisible) {
                const q = query(
                    collection(db, "profiles"), 
                    orderBy("timestamp", "desc"), 
                    startAfter(lastVisible), 
                    limit(20)
                );
                const snap = await getDocs(q);
                
                if (!snap.empty) {
                    lastVisible = snap.docs[snap.docs.length - 1];
                    let moreUsers = [];
                    snap.forEach(d => moreUsers.push({ id: d.id, ...d.data() }));
                    
                    // डुप्लीकेट यूजर्स को रोकने के लिए चेक करके जोड़ें
                    let existingIds = new Set(users.map(u => u.id));
                    let uniqueNewUsers = moreUsers.filter(u => !existingIds.has(u.id));
                    
                    if (uniqueNewUsers.length > 0) {
                        // 1. लोड हुई प्रोफाइल को नीचे (मोजूदा लिस्ट के बाद) जोड़ा गया है
                        users = [...users, ...uniqueNewUsers];
                        render();
                        // 2. प्रोफाइल लोड होने पर भाषा के अनुसार अलर्ट दिखेगा
                        showToast(t.profilesUpdated);
                    } else {
                        // 2. प्रोफाइल लोड न होने पर (नया डेटा न मिलने पर) भाषा के अनुसार अलर्ट दिखेगा
                        showToast(t.noNewProfiles);
                    }
                    
                    showLoader(false);
                    return;
                }
            }

            // अगर ऊपर वाले से डेटा न मिले या lastVisible न हो, तो शुरू से फ्रेश डेटा फेच करें ताकि कोई नया यूजर छूटे नहीं
            const fallbackQ = query(collection(db, "profiles"), orderBy("timestamp", "desc"), limit(users.length + 20));
            const fallbackSnap = await getDocs(fallbackQ);
            
            let freshList = [];
            fallbackSnap.forEach(d => freshList.push({ id: d.id, ...d.data() }));
            
            let existingIds = new Set(users.map(u => u.id));
            let uniqueNewUsers = freshList.filter(u => !existingIds.has(u.id));

            if (fallbackSnap.docs.length > 0) {
                lastVisible = fallbackSnap.docs[fallbackSnap.docs.length - 1];
            }

            if (uniqueNewUsers.length > 0) {
                users = [...users, ...uniqueNewUsers];
                render();
                showToast(t.profilesUpdated);
            } else {
                showToast(t.noNewProfiles);
            }

        } catch (e) {
            console.error("Load more error:", e);
            // यदि फायरबेस इंडेक्स की दिक्कत होगी, तो यह फॉलबैक ट्रिगर हो जाएगा और ऐप क्रैश नहीं होगा
            showToast(t.loadingText);
        } finally {
            showLoader(false);
        }
    }, 2000);
};

        function showToast(message) {
            let toast = document.getElementById("customToast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "customToast";
                toast.className = "fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg z-50 transition-opacity duration-300";
                document.body.appendChild(toast);
            }
            toast.innerText = message;
            toast.style.opacity = "1";
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => { toast.style.display = "none"; }, 300);
            }, 2000);
        }
        function maskNumber(fullNum) {
            if (!fullNum) return "";
            const clean = fullNum.trim();
            const match = clean.match(/^(\+\d+)(\d{2})(\d{8})$/) || clean.match(/^(\+\d+)(\d{2})(\d+)$/);
            if (!match) return clean;
            const [, code, firstTwo, rest] = match;
            return `${code} ${firstTwo}<span class="blur-digits">${rest}</span>`;
        }

        window.filterCategory = (cat) => {
            currentCat = cat;
            applyLanguage();
            render();
        }

        window.openModal = () => {
            document.getElementById("profileModal").classList.remove("hidden");
            const my = localStorage.getItem("my_profile");
            const t = translations[lang];
            
            const myView = document.getElementById("myProfileView");
            const formContainer = document.getElementById("profileFormContainer");

            if (my) {
                myView.classList.remove("hidden");
                formContainer.classList.add("hidden");

                const data = JSON.parse(my);
                document.getElementById("myViewImg").src = data.imageUrl;
                document.getElementById("myViewName").innerText = data.name;
                document.getElementById("myViewPhone").innerText = data.phone;
                document.getElementById("myViewCat").innerText = t.categories[data.category] || data.category;
            } else {
                myView.classList.add("hidden");
                formContainer.classList.remove("hidden");

                document.getElementById("modalTitle").innerText = t.modalNew;
                document.getElementById("pName").value = "";
                document.getElementById("pCountry").value = "+91";
                document.getElementById("pPhone").value = "";
                document.getElementById("pCategory").value = "Chat Boy";
                document.getElementById("backBtn").classList.add("hidden");
            }
        }

         window.switchToEditForm = () => {
            const my = localStorage.getItem("my_profile");

        /* ============================================================
   BULLETPROOF INSTAGRAM-STYLE BANNER CANVAS GENERATOR
   ============================================================ */
async function createInstagramStyleBanner(userData) {
    return new Promise((resolve) => {
        const canvas = document.createElement("canvas");
        canvas.width = 800;
        canvas.height = 800;
        const ctx = canvas.getContext("2d");

        // Background Gradient (Soft Instagram Vibes)
        const bgGrad = ctx.createLinearGradient(0, 0, 800, 800);
        bgGrad.addColorStop(0, "#fef3c7");
        bgGrad.addColorStop(0.5, "#dcfce7");
        bgGrad.addColorStop(1, "#fde68a");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 800, 800);

        // Draw Repeating 'W' Background Pattern
        ctx.font = "bold 42px sans-serif";
        ctx.fillStyle = "rgba(16, 185, 129, 0.22)";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let y = 50; y < 800; y += 90) {
            for (let x = 40; x < 800; x += 110) {
                const offsetX = (y % 180 === 0) ? 55 : 0;
                ctx.fillText("W", x + offsetX, y);
            }
        }

        // Draw White Central Instagram-style Profile Card Container
        const cardW = 540, cardH = 640;
        const cardX = (800 - cardW) / 2;
        const cardY = (800 - cardH) / 2;

        ctx.shadowColor = "rgba(0, 0, 0, 0.12)";
        ctx.shadowBlur = 30;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 15;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 36);
        ctx.fill();

        // Reset shadow
        ctx.shadowColor = "transparent";

        const finishDrawing = (imgObj) => {
            const imgSize = 160;
            const imgX = (800 - imgSize) / 2;
            const imgY = cardY + 40;

            // Circular Clip for Profile Image
            ctx.save();
            ctx.beginPath();
            ctx.arc(imgX + imgSize / 2, imgY + imgSize / 2, imgSize / 2, 0, Math.PI * 2);
            ctx.clip();
            
            if (imgObj) {
                try {
                    ctx.drawImage(imgObj, imgX, imgY, imgSize, imgSize);
                } catch (e) {
                    drawDefaultAvatar(ctx, imgX, imgY, imgSize, userData);
                }
            } else {
                drawDefaultAvatar(ctx, imgX, imgY, imgSize, userData);
            }
            ctx.restore();

            // Green Border around Profile Picture
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#10b981";
            ctx.beginPath();
            ctx.arc(imgX + imgSize / 2, imgY + imgSize / 2, imgSize / 2 + 2, 0, Math.PI * 2);
            ctx.stroke();

            // User Name
            ctx.fillStyle = "#111827";
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(userData.name || "WhatsChat User", 400, imgY + imgSize + 45);

            // Hindi Tagline inside Card
            ctx.fillStyle = "#4b5563";
            ctx.font = "16px sans-serif";
            ctx.fillText("अगर आप भी सिंगल हैं और दुनिया भर के अनजान", 400, imgY + imgSize + 85);
            ctx.fillText("लोगों से बातें करना चाहते हैं तो अभी विजिट करें", 400, imgY + imgSize + 110);
            
            // App Highlights
            ctx.fillStyle = "#059669";
            ctx.font = "bold 16px sans-serif";
            ctx.fillText("WhatsChat - इंडिया का नंबर 1 डायरेक्ट चैट ऐप", 400, imgY + imgSize + 138);

            // Bottom Green Button inside Card (Updated Keyword matching website)
            const btnW = 420, btnH = 56;
            const btnX = (800 - btnW) / 2;
            const btnY = cardY + cardH - 85;

            ctx.fillStyle = "#10b981";
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 18);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("🌐 Visit WhatsChat Now", 400, btnY + 34);

            // Convert canvas to Blob safely
            canvas.toBlob((blob) => {
                resolve(blob || new Blob([""], { type: "image/jpeg" }));
            }, "image/jpeg", 0.92);
        };

        // Fallback Avatar if image fails to load due to CORS
        function drawDefaultAvatar(ctx, x, y, size, data) {
            ctx.fillStyle = "#e5e7eb";
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = "#374151";
            ctx.font = "bold 50px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const initial = data.name ? data.name.charAt(0).toUpperCase() : "W";
            ctx.fillText(initial, x + size / 2, y + size / 2);
                        }
        // Load User Image with CORS check
        if (userData.imageUrl) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => finishDrawing(img);
            img.onerror = () => finishDrawing(null); // Fallback if image blocked
            img.src = userData.imageUrl;
        } else {
            finishDrawing(null);
        }
    });
}

        window.saveProfile = async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById("pImage");
    const file = fileInput.files[0];
    const t = translations[lang];
    const oldMyProf = JSON.parse(localStorage.getItem("my_profile"));

    if (!file && !oldMyProf) {
        alert(t.alertPhoto);
        return;
    }

    const btn = document.getElementById("saveBtn");
    btn.innerText = t.uploading;
    btn.disabled = true;

    try {
        let imageUrl = oldMyProf ? oldMyProf.imageUrl : "";

        if (file && navigator.onLine) {
            const compressedFile = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 600, maxHeight = 600; // रेजोल्यूशन 300 से बढ़ाकर 600 किया गया

                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        
                        // फोटो को साफ़ और शार्प रखने के लिए हाई क्वालिटी स्मूथिंग इनेबल की गई है
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', 0.95); // क्वालिटी 0.85 से बढ़ाकर 0.95 (95%) की गई
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
            const fd = new FormData();
            fd.append("file", compressedFile);
            fd.append("upload_preset", PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
            const uploadData = await res.json();
            imageUrl = uploadData.secure_url;
        }

        const name = document.getElementById("pName").value;
        const country = document.getElementById("pCountry").value.trim();
        const rawPhone = document.getElementById("pPhone").value.trim().slice(-10); 
        const fullPhone = country + rawPhone;
        const category = document.getElementById("pCategory").value;
        
        const profileId = oldMyProf ? oldMyProf.profileId : "user_" + Date.now();
        const profileData = { profileId, name, phone: fullPhone, category, imageUrl, timestamp: Date.now() };
        
        localStorage.setItem("my_profile", JSON.stringify(profileData));

        if (navigator.onLine) {
            await setDoc(doc(db, "profiles", profileId), profileData);
        }

        closeModal();
        fetchProfiles();
    } catch (err) {
        alert(t.alertError);
    } finally {
        btn.innerText = t.pub;
        btn.disabled = false;
    }
}
